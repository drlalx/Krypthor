<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg1" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#1e2433"/>
      <stop offset="65%" stop-color="#10131c"/>
      <stop offset="100%" stop-color="#08090e"/>
    </radialGradient>

    <!-- Outer Border Gradient -->
    <linearGradient id="border1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b35" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#2c3548" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Shield Body Metallic Gradient -->
    <linearGradient id="shieldMetal" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#2d3446"/>
      <stop offset="40%" stop-color="#1a1f2c"/>
      <stop offset="55%" stop-color="#353d52"/>
      <stop offset="100%" stop-color="#141822"/>
    </linearGradient>

    <!-- Shield Rim Gradient -->
    <linearGradient id="shieldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b47"/>
      <stop offset="45%" stop-color="#ffbe0b"/>
      <stop offset="100%" stop-color="#00f5d4"/>
    </linearGradient>

    <!-- Rust Gear Gradient -->
    <linearGradient id="rustGear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9f68"/>
      <stop offset="50%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#c83e1b"/>
    </linearGradient>

    <!-- Emerald Keyhole Glow -->
    <linearGradient id="cryptoCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#00bbf9"/>
    </linearGradient>

    <filter id="glow1" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg1)" stroke="url(#border1)" stroke-width="3"/>

  <!-- Subtle Background Hex Grid / Circuit Lines -->
  <g stroke="#00f5d4" stroke-width="1" stroke-opacity="0.12" fill="none">
    <path d="M 40 70 L 85 70 L 105 90"/>
    <path d="M 216 70 L 171 70 L 151 90"/>
    <path d="M 36 180 L 76 180 L 96 160"/>
    <path d="M 220 180 L 180 180 L 160 160"/>
    <circle cx="40" cy="70" r="2.5" fill="#00f5d4" fill-opacity="0.25"/>
    <circle cx="216" cy="70" r="2.5" fill="#00f5d4" fill-opacity="0.25"/>
    <circle cx="36" cy="180" r="2.5" fill="#00f5d4" fill-opacity="0.25"/>
    <circle cx="220" cy="180" r="2.5" fill="#00f5d4" fill-opacity="0.25"/>
  </g>

  <!-- Heavy Padlock Shackle (Top) -->
  <path d="M 88 102 L 88 68 A 40 40 0 0 1 168 68 L 168 102"
        fill="none" stroke="#8d99ae" stroke-width="16" stroke-linecap="round"/>
  <path d="M 88 102 L 88 68 A 40 40 0 0 1 168 68 L 168 102"
        fill="none" stroke="#e9ecef" stroke-width="4" stroke-linecap="round" stroke-opacity="0.5"/>

  <!-- Armored Cryptographic Shield Body -->
  <path d="M 56 88
           L 128 68
           L 200 88
           L 200 142
           C 200 186, 164 214, 128 228
           C 92 214, 56 186, 56 142 Z"
        fill="url(#shieldMetal)" stroke="url(#shieldRim)" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Inner Shield Bevel -->
  <path d="M 68 97
           L 128 80
           L 188 97
           L 188 140
           C 188 176, 158 200, 128 213
           C 98 200, 68 176, 68 140 Z"
        fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.18"/>

  <!-- Rust Vault Dial & Gear (12 Cogs) -->
  <g transform="translate(128, 144)">
    <!-- Outer Dial Ring -->
    <circle cx="0" cy="0" r="46" fill="none" stroke="#00f5d4" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="6 4"/>

    <!-- Gear Teeth -->
    <g fill="url(#rustGear)">
      <rect x="-6" y="-42" width="12" height="84" rx="3"/>
      <rect x="-6" y="-42" width="12" height="84" rx="3" transform="rotate(30)"/>
      <rect x="-6" y="-42" width="12" height="84" rx="3" transform="rotate(60)"/>
      <rect x="-6" y="-42" width="12" height="84" rx="3" transform="rotate(90)"/>
      <rect x="-6" y="-42" width="12" height="84" rx="3" transform="rotate(120)"/>
      <rect x="-6" y="-42" width="12" height="84" rx="3" transform="rotate(150)"/>
    </g>

    <!-- Gear Main Ring -->
    <circle cx="0" cy="0" r="33" fill="url(#rustGear)" stroke="#ffbe0b" stroke-width="1.5" stroke-opacity="0.6"/>
    <!-- Dark Vault Core -->
    <circle cx="0" cy="0" r="22" fill="#0d1017" stroke="#ff6b35" stroke-width="2"/>

    <!-- Glowing Keyhole Inside Vault Core -->
    <g filter="url(#glow1)">
      <circle cx="0" cy="-4" r="7" fill="url(#cryptoCyan)"/>
      <path d="M -3.5 0 L -6 13 L 6 13 L 3.5 0 Z" fill="url(#cryptoCyan)"/>
    </g>
    <circle cx="0" cy="-4" r="3" fill="#ffffff"/>
  </g>
</svg>
