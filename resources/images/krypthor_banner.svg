<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="880" height="240">
  <defs>
    <linearGradient id="bannerBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1117"/>
      <stop offset="55%" stop-color="#151922"/>
      <stop offset="100%" stop-color="#0c0e14"/>
    </linearGradient>

    <linearGradient id="bannerBorder1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b35" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#2b3140" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="0.75"/>
    </linearGradient>

    <linearGradient id="rsTextGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8c61"/>
      <stop offset="50%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#de4c36"/>
    </linearGradient>

    <linearGradient id="shieldMetalB" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#2d3446"/>
      <stop offset="40%" stop-color="#1a1f2c"/>
      <stop offset="55%" stop-color="#353d52"/>
      <stop offset="100%" stop-color="#141822"/>
    </linearGradient>

    <linearGradient id="shieldRimB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b47"/>
      <stop offset="45%" stop-color="#ffbe0b"/>
      <stop offset="100%" stop-color="#00f5d4"/>
    </linearGradient>

    <linearGradient id="rustGearB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9f68"/>
      <stop offset="50%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#c83e1b"/>
    </linearGradient>

    <linearGradient id="cryptoCyanB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#00bbf9"/>
    </linearGradient>

    <filter id="glowB1" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Banner Card Background -->
  <rect x="4" y="4" width="872" height="232" rx="28" fill="url(#bannerBg1)" stroke="url(#bannerBorder1)" stroke-width="2.5"/>

  <!-- Subtle Background Cryptographic Circuit Lines -->
  <g stroke="#00f5d4" stroke-width="1.2" stroke-opacity="0.1" fill="none">
    <path d="M 260 198 L 480 198 L 510 175 L 860 175"/>
    <path d="M 260 212 L 560 212 L 585 192 L 860 192"/>
  </g>

  <!-- Embedded Scalable Vector Icon on Left (Concept 1: Aegis Vault Shield) -->
  <g transform="translate(18, 2) scale(0.92)">
    <!-- Subtle Background Hex Grid / Circuit Lines -->
    <g stroke="#00f5d4" stroke-width="1" stroke-opacity="0.16" fill="none">
      <path d="M 40 70 L 85 70 L 105 90"/>
      <path d="M 216 70 L 171 70 L 151 90"/>
      <path d="M 36 180 L 76 180 L 96 160"/>
      <path d="M 220 180 L 180 180 L 160 160"/>
      <circle cx="40" cy="70" r="2.5" fill="#00f5d4" fill-opacity="0.3"/>
      <circle cx="216" cy="70" r="2.5" fill="#00f5d4" fill-opacity="0.3"/>
      <circle cx="36" cy="180" r="2.5" fill="#00f5d4" fill-opacity="0.3"/>
      <circle cx="220" cy="180" r="2.5" fill="#00f5d4" fill-opacity="0.3"/>
    </g>

    <!-- Heavy Padlock Shackle (Top) -->
    <path d="M 88 102 L 88 68 A 40 40 0 0 1 168 68 L 168 102"
          fill="none" stroke="#8d99ae" stroke-width="16" stroke-linecap="round"/>
    <path d="M 88 102 L 88 68 A 40 40 0 0 1 168 68 L 168 102"
          fill="none" stroke="#e9ecef" stroke-width="4" stroke-linecap="round" stroke-opacity="0.5"/>

    <!-- Armored Cryptographic Shield Body -->
    <path d="M 56 88
             L 128 68
             L 200 88
             L 200 142
             C 200 186, 164 214, 128 228
             C 92 214, 56 186, 56 142 Z"
          fill="url(#shieldMetalB)" stroke="url(#shieldRimB)" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- Inner Shield Bevel -->
    <path d="M 68 97
             L 128 80
             L 188 97
             L 188 140
             C 188 176, 158 200, 128 213
             C 98 200, 68 176, 68 140 Z"
          fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.18"/>

    <!-- Rust Vault Dial & Gear (12 Cogs) -->
    <g transform="translate(128, 144)">
      <circle cx="0" cy="0" r="46" fill="none" stroke="#00f5d4" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="6 4"/>
      <g fill="url(#rustGearB)">
        <rect x="-6" y="-42" width="12" height="84" rx="3"/>
        <rect x="-6" y="-42" width="12" height="84" rx="3" transform="rotate(30)"/>
        <rect x="-6" y="-42" width="12" height="84" rx="3" transform="rotate(60)"/>
        <rect x="-6" y="-42" width="12" height="84" rx="3" transform="rotate(90)"/>
        <rect x="-6" y="-42" width="12" height="84" rx="3" transform="rotate(120)"/>
        <rect x="-6" y="-42" width="12" height="84" rx="3" transform="rotate(150)"/>
      </g>
      <circle cx="0" cy="0" r="33" fill="url(#rustGearB)" stroke="#ffbe0b" stroke-width="1.5" stroke-opacity="0.6"/>
      <circle cx="0" cy="0" r="22" fill="#0d1017" stroke="#ff6b35" stroke-width="2"/>

      <g filter="url(#glowB1)">
        <circle cx="0" cy="-4" r="7" fill="url(#cryptoCyanB)"/>
        <path d="M -3.5 0 L -6 13 L 6 13 L 3.5 0 Z" fill="url(#cryptoCyanB)"/>
      </g>
      <circle cx="0" cy="-4" r="3" fill="#ffffff"/>
    </g>
  </g>

  <!-- Typography & Branding -->
  <text x="256" y="100" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Ubuntu, sans-serif" font-size="60" font-weight="800" letter-spacing="-1">
    <tspan fill="url(#rsTextGrad1)">Krypthor</tspan><tspan dx="14" fill="#f8f9fa">Vault</tspan>
  </text>

  <!-- Subtitle -->
  <text x="258" y="138" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Ubuntu, sans-serif" font-size="18.5" font-weight="500" fill="#adb5bd" letter-spacing="0.3">
    Zero-Knowledge Encrypted Vaults in Pure Rust
  </text>

  <!-- Feature Pills -->
  <g transform="translate(258, 160)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Ubuntu, monospace" font-size="13" font-weight="600">
    <rect x="0" y="0" width="182" height="30" rx="15" fill="#1c2230" stroke="#ff6b35" stroke-width="1.2" stroke-opacity="0.65"/>
    <text x="91" y="20" fill="#ff9f68" text-anchor="middle">AES-256-GCM • Scrypt</text>

    <rect x="194" y="0" width="196" height="30" rx="15" fill="#1c2230" stroke="#00f5d4" stroke-width="1.2" stroke-opacity="0.55"/>
    <text x="292" y="20" fill="#72efdd" text-anchor="middle">FUSE • WebDAV • REST</text>

    <rect x="402" y="0" width="186" height="30" rx="15" fill="#1c2230" stroke="#8d99ae" stroke-width="1.2" stroke-opacity="0.45"/>
    <text x="495" y="20" fill="#e9ecef" text-anchor="middle">egui • TUI • Web UI</text>
  </g>
</svg>
