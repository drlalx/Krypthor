# Config for faster compilation.
#
# If you install a faster linker like `mold` or `lld`, you can enable it below
# to significantly speed up link times (reducing them from seconds to milliseconds).
#
# To install:
#   Ubuntu/Debian: `sudo apt install mold` or `sudo apt install lld`
#   Arch Linux:    `sudo pacman -S mold` or `sudo pacman -S lld`
#   macOS:         `brew install mold`

# [target.x86_64-unknown-linux-gnu]
# linker = "clang"
# rustflags = ["-C", "link-arg=-fuse-ld=mold"] # Use mold linker
# # rustflags = ["-C", "link-arg=-fuse-ld=lld"]  # Alternative: Use LLD linker
