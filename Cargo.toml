[package]
name = "krypthor"
version = "0.1.0"
edition = "2024"
authors = ["Alexander Drichel"]
license = "MIT"
description = "Krypthor Vault: Modern, memory-safe zero-knowledge encrypted vaults in Rust with egui GUI, Ratatui TUI, and Web Daemon."

[features]
default = ["egui-ui", "tui", "web"]
egui-ui = ["dep:eframe", "dep:egui", "dep:egui-elegance", "dep:png"]
tui = ["dep:ratatui", "dep:crossterm"]
web = ["dep:tokio", "dep:axum", "dep:tower", "dep:tower-http", "dep:mime_guess", "dep:zip", "dep:dav-server", "dep:futures-util"]
fuse = ["dep:fuser", "dep:libc"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
scrypt = { version = "0.11", features = ["simple"] }
aes-gcm = "0.10"
base64 = "0.22"
hex = "0.4"
rand = "0.8"
sha2 = "0.10"
bytes = "1"
rfd = "0.14"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
ratatui = { version = "0.26", optional = true }
crossterm = { version = "0.27", optional = true }
egui = { version = "0.36", optional = true }
egui-elegance = { version = "0.16", optional = true }
png = { version = "0.18", optional = true }
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"], optional = true }
axum = { version = "0.8", features = ["multipart", "tokio", "json"], optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }
mime_guess = { version = "2.0", optional = true }
zip = { version = "2.2", default-features = false, features = ["deflate"], optional = true }
dav-server = { version = "0.11", default-features = false, optional = true }
futures-util = { version = "0.3", default-features = false, features = ["alloc"], optional = true }

[target.'cfg(unix)'.dependencies]
fuser = { version = "0.14", default-features = false, optional = true }
libc = { version = "0.2", optional = true }

[target.'cfg(windows)'.dependencies.eframe]
version = "0.36"
default-features = false
features = ["glow"]
optional = true

[target.'cfg(target_os = "linux")'.dependencies.eframe]
version = "0.36"
default-features = false
features = ["glow", "wayland", "x11", "default_fonts"]
optional = true

[target.'cfg(target_os = "macos")'.dependencies.eframe]
version = "0.36"
default-features = false
features = ["glow", "default_fonts"]
optional = true

[lints.clippy]
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic_in_result_fn = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"

[patch.crates-io]
# Temporary workaround for mixed-DPI window dragging; remove after the fix ships in winit 0.30.x.
winit = { git = "https://github.com/LunaticGhoulPiano/winit", rev = "39c4009c41e5977d779cf8a365792c8153ca77c5" }

[profile.dev]
opt-level = 0
lto = false
codegen-units = 256
incremental = true
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
codegen-units = 16
lto = false
incremental = true
strip = "debuginfo"
